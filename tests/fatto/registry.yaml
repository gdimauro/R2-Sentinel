# =============================================================================
# REGISTRO DEI CRITERI DI FATTO
#
# Ogni criterio di FATTO dichiarato nei file agente ha qui una riga con UN
# comando che lo esegue o che ne raccoglie la misura. Un criterio senza comando
# non e' verificabile: resta in questo file con `command: null` e `blocked_by`
# compilato, e viene segnalato al chief-engineer. Non sparisce.
#
# Esecuzione:   ./scripts/fatto.sh                 tutto cio' che gira senza banco
#               ./scripts/fatto.sh <ruolo>         solo un ruolo
#               ./scripts/fatto.sh --list          elenco con stato
#               R2S_BENCH=1 ./scripts/fatto.sh ... include le prove da banco
#
# Campi:
#   kind:    ci      -> gira ovunque, anche in CI, senza hardware
#            bench   -> richiede il banco fisico; in CI viene SALTATO, mai fallito
#            manual  -> protocollo umano; il comando raccoglie/valida la misura
#   status:  stub        -> il comando esiste ma il test e' da scrivere (owner)
#            implemented -> il comando misura davvero
#   La distinzione conta: uno stub che "passa" e' peggio di un test assente.
# =============================================================================

