# Riproducibilita' su macchina VERGINE. Non gira su ogni PR: e' lento e non
# cambia a ogni commit. Gira di notte, sui cambi al bootstrap, e a mano.
#
# Il criterio chiede DUE esecuzioni riuscite su ambiente vergine, non una.
name: Riproducibilita' (macchina vergine)

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "scripts/bootstrap.sh"
      - "scripts/setup/**"
      - "docker/**"
      - "requirements-dev.txt"
      - "firmware/toolchain.yaml"
      - "software/ros2_ws/src/**/package.xml"
  workflow_dispatch:

jobs:
  bootstrap-vergine:
    name: git clone -> workspace compilato (esecuzione ${{ matrix.run }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]   # due esecuzioni indipendenti: una sola non dimostra nulla
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap in container Ubuntu 24.04 vergine
        run: |
          docker build -q -f docker/ubuntu2404-clean.Dockerfile -t r2s-clean .
          START=$(date +%s)
          docker run --rm -v "$PWD:/src:ro" r2s-clean bash -lc '
            set -e
            cp -r /src/. /home/dev/R2-Sentinel/
            cd /home/dev/R2-Sentinel
            rm -rf .venv software/ros2_ws/build software/ros2_ws/install software/ros2_ws/log
            ./scripts/bootstrap.sh --yes --skip-idf
            source software/ros2_ws/install/setup.bash
            test "$(ros2 pkg list | grep -c "^r2s_")" -eq 6
          '
          DT=$(( $(date +%s) - START ))
          echo "tempo di bootstrap: $((DT/60))m $((DT%60))s"
          echo "### Bootstrap #${{ matrix.run }}: $((DT/60))m $((DT%60))s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DT" -gt 1800 ]; then
            echo "::error::fuori budget: oltre 30 minuti"
            exit 1
          fi
      # ESP-IDF e' escluso da questo job (~1,5 GB di clone): ha il suo job in ci.yml.
