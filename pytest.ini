[pytest]
# Separazione netta fra cio' che gira ovunque e cio' che richiede il banco.
# Un test da banco eseguito in CI non deve fallire: deve essere SALTATO in modo
# esplicito, con il motivo. Un rosso che tutti imparano a ignorare spegne la CI.
testpaths = tests
markers =
    ci: gira ovunque, nessun hardware richiesto (default in CI)
    bench: richiede il banco fisico; saltato se R2S_BENCH != 1
    hardware(dev): richiede uno specifico dispositivo (hailo, esp32, lidar, mic, anemometro)
    slow: dura piu' di 60 s
    manual: protocollo umano; raccoglie/valida una misura fatta a mano
addopts = -ra --strict-markers --timeout=600
timeout = 600
